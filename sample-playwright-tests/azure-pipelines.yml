name: AI PR Review Pipeline

# 1. Trigger ONLY when PR target branch is in this list (Non-listed branches will NOT trigger)
pr:
  branches:
    include:
      - main
      - develop
      - release/*

trigger: none

# 2. Reference Variable Group in Azure DevOps (Contains Azure OpenAI secrets)
variables:
  - group: AI-Review-Variables

jobs:
  # 3. Deployment job linked to Environment (Handles Manual Approval in ADO UI)
  - deployment: AI_PR_Review
    displayName: 'AI PR Code Reviewer'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'AI-Review-Approval' # Configure Manual Approvers on this Environment in ADO UI
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 0
              displayName: 'Checkout repo with full history'

            - task: NodeTool@0
              inputs:
                versionSpec: '20.x'

            # 4. Authenticate with Azure Artifacts feed
            - task: npmAuthenticate@0
              displayName: 'Authenticate with Azure Artifacts'
              inputs:
                workingIndex: '$(System.DefaultWorkingDirectory)/.npmrc'

            # 5. Configure scoped feed & execute AI Review once manual approval is granted
            - script: |
                # Configure @mycompany scope to point to your Azure Artifacts feed
                echo "@mycompany:registry=https://pkgs.dev.azure.com/YOUR_ORG/YOUR_PROJECT/_packaging/YOUR_FEED_NAME/npm/registry/" > .npmrc
                echo "always-auth=true" >> .npmrc

                # Install local project dependencies and run AI review
                npm ci
                npx --yes @mycompany/ai-capabilities review
              displayName: 'Execute AI Review & Post Comments'
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
                AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
                AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
