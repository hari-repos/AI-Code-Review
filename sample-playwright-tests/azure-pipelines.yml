name: AI PR Review Pipeline

pr:
  branches:
    include:
      - main
      - develop
      - release/*

trigger: none

variables:
  - group: AI-Review-Variables

jobs:
  - deployment: AI_PR_Review
    displayName: 'AI PR Code Reviewer'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'AI-Review-Approval'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 0

            - task: NodeTool@0
              inputs:
                versionSpec: '20.x'

            - task: npmAuthenticate@0
              inputs:
                workingIndex: '$(System.DefaultWorkingDirectory)/.npmrc'

            - script: |
                npm ci
                npx --yes @mycompany/ai-capabilities review
              displayName: 'Execute AI PR Review'
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
                AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
                AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
