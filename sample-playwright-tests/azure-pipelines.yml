name: AI PR Review Pipeline

pr:
  branches:
    include:
      - main
      - develop
      - release/*

trigger: none

variables:
  - group: AI-Review-Variables

jobs:
  - deployment: AI_PR_Review
    displayName: 'AI PR Code Reviewer'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'AI-Review-Approval'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 0

            - task: NodeTool@0
              inputs:
                versionSpec: '20.x'

            # 1. Create temporary directory and .npmrc file (Filename MUST be '.npmrc')
            - script: |
                mkdir -p $(Pipeline.Workspace)/ai-feed
                echo "@mycompany:registry=https://pkgs.dev.azure.com/YOUR_ORG/YOUR_PROJECT/_packaging/ACTUAL_AI_FEED_NAME/npm/registry/" > $(Pipeline.Workspace)/ai-feed/.npmrc
                echo "always-auth=true" >> $(Pipeline.Workspace)/ai-feed/.npmrc
              displayName: 'Prepare AI Feed Configuration'

            # 2. Authenticate the AI Feed .npmrc (npmAuthenticate requires filename to end in '.npmrc')
            - task: npmAuthenticate@0
              displayName: 'Authenticate with AI Feed'
              inputs:
                workingIndex: '$(Pipeline.Workspace)/ai-feed/.npmrc'

            # 3. Install @mycompany/ai-capabilities from AI Feed & run with npx
            - script: |
                # Install package using dedicated AI feed config
                npm install --no-save --userconfig $(Pipeline.Workspace)/ai-feed/.npmrc @mycompany/ai-capabilities
                
                # Execute review using npx
                npx ai-pr-review
              displayName: 'Fetch AI Package & Execute Review'
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
                AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
                AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
