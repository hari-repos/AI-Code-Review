name: AI PR Review Pipeline

pr:
  branches:
    include:
      - main
      - develop
      - release/*

trigger: none

variables:
  - group: AI-Review-Variables

jobs:
  - deployment: AI_PR_Review
    displayName: 'AI PR Code Reviewer'
    pool:
      name: 'YOUR_SELF_HOSTED_POOL_NAME'
      demands:
        - agent.name -equals YOUR_AGENT_NAME

    environment: 'AI-Review-Approval'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: false
              fetchDepth: 0
              persistCredentials: true

            # 1. Update repo root .npmrc using relative path ./.npmrc (Avoids Windows backslash escaping)
            - bash: |
                echo "@mycompany:registry=https://pkgs.dev.azure.com/YOUR_ORG/YOUR_PROJECT/_packaging/ACTUAL_AI_FEED_NAME/npm/registry/" >> ./.npmrc
                echo "always-auth=true" >> ./.npmrc
              displayName: 'Update repo .npmrc with AI Feed URL'

            # 2. Authenticate repo .npmrc
            - task: npmAuthenticate@0
              displayName: 'Authenticate with Azure Artifacts'
              inputs:
                workingFile: '$(Build.SourcesDirectory)/.npmrc'

            # 3. Install AI package & run review
            - bash: |
                node -v
                npm install --no-save @mycompany/ai-capabilities
                npx ai-pr-review
              displayName: 'Fetch AI Package & Execute Review'
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
                AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
                AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
