name: Playwright Project - AI PR Code Reviewer

pr:
  branches:
    include:
      - main
      - develop
      - project-main
      - release/*

trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js 20.x'

  - script: |
      npm ci
    displayName: 'Install Dependencies'

  # Executes the CLI exposed by @mycompany/core-engine package
  - script: |
      npx ai-pr-review
    displayName: 'Run Enterprise AI Code Reviewer'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      OPENAI_API_KEY: $(OPENAI_API_KEY)
